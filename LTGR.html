<!doctype html>
<html lang="ar" dir="rtl"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مولد الحروف</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;700;900&amp;display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans Arabic', sans-serif; }
    .letter-display {
      font-size: clamp(7rem, 22vw, 16rem);
      line-height: 1;
      text-shadow: 0 0 40px rgba(251,191,36,0.5), 0 4px 20px rgba(0,0,0,0.4);
      transition: transform 0.15s ease;
    }
    .letter-display.pop {
      transform: scale(1.15);
    }
    .letter-toggle {
      width: 44px; height: 44px;
      border-radius: 10px;
      font-size: 1.25rem;
      font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
      border: 2px solid rgba(251,191,36,0.4);
      background: rgba(251,191,36,0.1);
      color: #fbbf24;
    }
    .letter-toggle.disabled {
      opacity: 0.25;
      border-color: rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.03);
      color: #64748b;
      text-decoration: line-through;
    }
    .letter-toggle:hover { transform: scale(1.1); }
    @keyframes highlight {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }
    .letter-toggle.shuffle {
      animation: highlight 0.08s infinite;
      background: rgba(251,191,36,0.3);
      border-color: rgba(251,191,36,0.8);
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js" type="text/javascript"></script>
 </head>
 <body class="min-h-screen flex flex-col items-center justify-center gap-8 p-6" style="background: linear-gradient(160deg, rgb(15, 23, 42), rgb(30, 26, 46));">
  <header class="text-center">
   <h1 class="canva-text" style="color: rgb(251, 191, 36); font-weight: 900; font-style: normal; font-size: 38px;">مولد الحروف</h1>
  </header>
  <main class="flex flex-col items-center gap-8">
   <div id="letter" class="letter-display font-black select-none" style="color: rgb(251, 191, 36); font-weight: 700; font-style: normal; font-size: 18px;">؟</div>
   <section class="w-full max-w-md">
    <p class="canva-text text-center mb-3 text-sm" style="color: rgb(148, 163, 184); font-weight: 700; font-style: normal; font-size: 18px;">اضغط على الحرف لإيقافه</p>
    <div id="letter-grid" class="flex flex-wrap justify-center gap-2"></div>
   </section>
   <button class="canva-button px-10 py-4 rounded-full text-2xl font-bold active:scale-95 transition-transform shadow-lg" id="gen-btn" style="background: rgb(251, 191, 36); color: rgb(15, 23, 42); font-weight: 700; font-style: normal; font-size: 18px;">حرف جديد</button>
  </main>
  <script>
    const allLetters = 'أبتثجحخدذرزسشصضطظعغفقكلمنهوي'.split('');
    const excluded = new Set();
    const display = document.getElementById('letter');
    const grid = document.getElementById('letter-grid');

    const letterBtns = new Map();

    allLetters.forEach(l => {
      const btn = document.createElement('button');
      btn.className = 'letter-toggle';
      btn.textContent = l;
      btn.type = 'button';
      btn.setAttribute('aria-pressed', 'true');
      letterBtns.set(l, btn);
      btn.addEventListener('click', () => {
        if (excluded.has(l)) {
          excluded.delete(l);
          btn.classList.remove('disabled');
          btn.setAttribute('aria-pressed', 'true');
        } else {
          excluded.add(l);
          btn.classList.add('disabled');
          btn.setAttribute('aria-pressed', 'false');
        }
      });
      grid.appendChild(btn);
    });

    let spinning = false;

    document.getElementById('gen-btn').addEventListener('click', () => {
      if (spinning) return;
      const pool = allLetters.filter(l => !excluded.has(l));
      if (pool.length === 0) return;

      spinning = true;

      let steps = 18 + Math.floor(Math.random() * 8);
      let delay = 40;
      let i = 0;
      let lastLetter = null;

      function tick() {
        const randomLetter = pool[Math.floor(Math.random() * pool.length)];

        if (lastLetter && letterBtns.has(lastLetter)) {
          letterBtns.get(lastLetter).classList.remove('shuffle');
        }

        if (letterBtns.has(randomLetter)) {
          letterBtns.get(randomLetter).classList.add('shuffle');
        }
        lastLetter = randomLetter;
        display.textContent = randomLetter;

        i++;
        if (i < steps) {
          delay += (i > steps * 0.6) ? 30 : 5;
          setTimeout(tick, delay);
        } else {
          if (lastLetter && letterBtns.has(lastLetter)) {
            letterBtns.get(lastLetter).classList.remove('shuffle');
            excluded.add(lastLetter);
            letterBtns.get(lastLetter).classList.add('disabled');
            letterBtns.get(lastLetter).setAttribute('aria-pressed', 'false');
          }
          display.classList.add('pop');
          setTimeout(() => display.classList.remove('pop'), 250);
          spinning = false;
        }
      }
      tick();
    });
  </script>
</body>
</html>
