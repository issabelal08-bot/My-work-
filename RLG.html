<!doctype html>
<html lang="ar" dir="rtl"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مولد الحروف</title>
  <link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg-deep: #12141c;
      --bg-deep-2: #1b1e29;
      --panel: #23283a;
      --hinge: rgba(0,0,0,0.55);
      --cream: #f2ecd9;
      --cream-dim: #9aa0b4;
      --amber: #f2b84b;
      --amber-dim: rgba(242,184,75,0.35);
      --off-red-dim: rgba(122,51,70,0.4);
    }
    *{ box-sizing: border-box; }
    html,body{ height:100%; margin:0; overflow:hidden; }
    body{
      font-family: 'Cairo', sans-serif;
      height:100vh; height:100dvh;
      width:100vw;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap: 4.5vmin;
      padding: 3vmin 3vmin;
      background:
        radial-gradient(circle at 50% 0%, rgba(242,184,75,0.06), transparent 55%),
        linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-deep-2) 100%);
      color: var(--cream);
    }

    /* ---------- Title ---------- */
    header{ text-align:center; flex-shrink:0; }
    .title{
      font-family: 'Lalezar', 'Cairo', sans-serif;
      font-weight:400;
      font-size: clamp(2.4rem, 9.5vmin, 4rem);
      letter-spacing: 2px;
      color: var(--amber);
      text-shadow: 0 0 30px rgba(242,184,75,0.35);
      margin:0;
    }

    /* ---------- Main split-flap card ---------- */
    .board{
      position: relative;
      width: min(56vmin, 320px);
      aspect-ratio: 1 / 1.05;
      flex-shrink:0;
      background: var(--panel);
      border-radius: 18px;
      box-shadow:
        0 20px 50px rgba(0,0,0,0.55),
        inset 0 0 0 1px rgba(255,255,255,0.04);
      display:flex; align-items:center; justify-content:center;
      perspective: 900px;
    }
    .board::before, .board::after{
      content:"";
      position:absolute; inset: 10px;
      border-radius: 10px;
      pointer-events:none;
    }
    .board::before{
      background: linear-gradient(180deg, rgba(255,255,255,0.05), transparent 40%);
    }
    .board::after{
      top: 50%; bottom: auto; left: 10px; right: 10px; height: 3px;
      transform: translateY(-50%);
      background: var(--hinge);
      box-shadow: 0 1px 0 rgba(255,255,255,0.06);
    }
    .letter-display{
      position: relative;
      font-family: 'Lalezar', 'Cairo', sans-serif;
      font-weight:400;
      font-size: clamp(4rem, 26vmin, 9rem);
      line-height: 1;
      color: var(--cream);
      transform-style: preserve-3d;
      transition: transform 0.11s ease-out;
      user-select:none;
    }
    .letter-display.flip{
      transform: rotateX(35deg) scale(0.94);
    }
    .letter-display.pop{
      animation: settle 0.32s ease-out;
    }
    @keyframes settle{
      0%{ transform: rotateX(-18deg) scale(1.08); }
      60%{ transform: rotateX(6deg) scale(0.98); }
      100%{ transform: rotateX(0) scale(1); }
    }

    /* ---------- Lever button ---------- */
    .lever-wrap{ display:flex; flex-direction:row; align-items:center; gap:2vmin; flex-shrink:0; }
    #gen-btn{
      font-family:'Cairo', sans-serif;
      font-weight:800;
      font-size: clamp(1rem, 3vmin, 1.4rem);
      color: var(--bg-deep);
      background: linear-gradient(180deg, #ffd27a, var(--amber));
      border: none;
      padding: 1.8vmin 5.5vmin;
      border-radius: 999px;
      cursor:pointer;
      box-shadow:
        0 6px 0 #b8842b,
        0 12px 20px rgba(242,184,75,0.25);
      transition: transform 0.08s ease, box-shadow 0.08s ease;
      letter-spacing: 0.5px;
    }
    #gen-btn:active{
      transform: translateY(5px);
      box-shadow:
        0 1px 0 #b8842b,
        0 4px 10px rgba(242,184,75,0.2);
    }
    #gen-btn:disabled{
      opacity:0.6;
      cursor:default;
    }

    /* ---------- Tool row (delete mode / open all) ---------- */
    .tool-row{ display:flex; flex-direction:row; align-items:center; justify-content:center; gap:2vmin; flex-shrink:0; }
    .tool-btn{
      font-family:'Cairo', sans-serif;
      font-weight:700;
      font-size: clamp(0.7rem, 1.9vmin, 0.95rem);
      color: var(--cream);
      background: transparent;
      border: 1.5px solid rgba(242,236,217,0.3);
      padding: 1.1vmin 3vmin;
      border-radius: 999px;
      cursor:pointer;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.08s ease, color 0.15s ease;
    }
    .tool-btn:hover{ background: rgba(242,236,217,0.08); border-color: rgba(242,236,217,0.5); }
    .tool-btn:active{ transform: translateY(2px); }
    .tool-btn.active{
      background: var(--off-red-dim);
      border-color: rgba(122,51,70,0.9);
      color: #ffd7de;
    }

    /* ---------- Log ---------- */
    .log-wrap{
      width: min(90vw, 88vmin, 420px);
      background: var(--panel);
      border-radius: 12px;
      padding: 1.4vmin 1.8vmin;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
      flex-shrink:1;
      min-height:0;
    }
    .log-header{
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom: 0.8vmin;
    }
    .log-title{
      font-size: clamp(0.65rem, 1.7vmin, 0.85rem);
      color: var(--cream-dim);
      letter-spacing: 0.5px;
    }
    #copy-btn{
      font-family:'Cairo', sans-serif;
      font-size: clamp(0.6rem, 1.6vmin, 0.8rem);
      font-weight:700;
      color: var(--amber);
      background: var(--amber-dim);
      border: none;
      border-radius: 999px;
      padding: 0.5vmin 2vmin;
      cursor:pointer;
      transition: background 0.15s ease;
    }
    #copy-btn:hover{ background: rgba(242,184,75,0.5); }
    #log{
      width:100%;
      height: 8vmin;
      min-height: 44px;
      resize:none;
      border:none;
      outline:none;
      background:transparent;
      color: var(--cream);
      font-family:'Cairo', sans-serif;
      font-size: clamp(0.7rem, 1.8vmin, 0.95rem);
      line-height:1.5;
      overflow-y:auto;
      direction: rtl;
      display:block;
    }
    #log::placeholder{ color: var(--cream-dim); opacity:0.6; }

    /* ---------- Confirm modal ---------- */
    .modal-overlay{
      position: fixed; inset: 0;
      background: rgba(10,11,16,0.75);
      display:flex; align-items:center; justify-content:center;
      padding: 6vmin;
      z-index: 50;
    }
    .modal-overlay.hidden{ display:none; }
    .modal-box{
      width: min(85vw, 78vmin, 340px);
      background: var(--panel);
      border-radius: 14px;
      padding: 3.2vmin 3vmin;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,255,255,0.06);
      text-align:center;
    }
    .modal-text{
      font-size: clamp(0.85rem, 2.2vmin, 1.05rem);
      color: var(--cream);
      line-height:1.7;
      margin: 0 0 2.6vmin;
    }
    .modal-actions{
      display:flex; gap: 1.6vmin;
      justify-content:center;
    }
    .modal-btn{
      font-family:'Cairo', sans-serif;
      font-weight:700;
      font-size: clamp(0.75rem, 2vmin, 0.95rem);
      border-radius: 999px;
      padding: 1.1vmin 4vmin;
      cursor:pointer;
      border: none;
      transition: transform 0.08s ease, opacity 0.15s ease;
    }
    .modal-btn:active{ transform: translateY(2px); }
    .modal-confirm{
      background: var(--amber);
      color: var(--bg-deep);
    }
    .modal-cancel{
      background: transparent;
      color: var(--cream);
      border: 1.5px solid rgba(242,236,217,0.3);
    }

    /* ---------- Letter tile grid ---------- */
    .grid-wrap{ width: min(90vw, 88vmin, 420px); display:flex; flex-direction:column; align-items:center; gap:1.2vmin; flex-shrink:1; }
    #letter-grid{
      display:flex; flex-wrap:wrap; justify-content:center; gap:1.8vmin 1.6vmin;
    }
    .letter-toggle{
      position:relative;
      width: clamp(36px, 7.2vmin, 52px); height: clamp(36px, 7.2vmin, 52px);
      border-radius: 9px;
      font-family:'Cairo', sans-serif;
      font-size: clamp(1rem, 3vmin, 1.4rem);
      font-weight: 700;
      display:flex; align-items:center; justify-content:center;
      cursor: default;
      border: none;
      background: var(--panel);
      color: var(--cream);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06), 0 2px 0 rgba(0,0,0,0.35);
      transition: transform 0.12s ease, background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
    }
    #letter-grid.delete-mode .letter-toggle{ cursor:pointer; }
    #letter-grid.delete-mode .letter-toggle:hover{ transform: translateY(-2px); }
    .letter-toggle::after{
      content:"";
      position:absolute; left:4px; right:4px; top:50%;
      height:1px; background: rgba(0,0,0,0.4);
      transform: translateY(-50%);
    }
    .letter-toggle.disabled{
      background: var(--off-red-dim);
      color: #cfa7b1;
      text-decoration: line-through;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03);
      opacity:0.55;
    }
    .letter-toggle.shuffle{
      background: var(--amber);
      color: var(--bg-deep);
      box-shadow: 0 0 0 2px var(--amber-dim), 0 4px 12px rgba(242,184,75,0.4);
      transform: scale(1.12);
    }
    .hint{
      font-size: 12px;
      color: var(--cream-dim);
      opacity: 0;
      letter-spacing: 0.3px;
      margin: 0;
      text-align:center;
      line-height: 1.4;
      min-height: 1.4em;
      transition: opacity 0.2s ease;
    }
    .hint.visible{
      opacity: 0.6;
    }

    @keyframes wiggle{
      0%, 100% { transform: rotate(-2deg); }
      50% { transform: rotate(2deg); }
    }
    #letter-grid.delete-mode .letter-toggle{
      animation: wiggle 0.22s ease-in-out infinite;
    }
    #letter-grid.delete-mode .letter-toggle.disabled{
      animation: none;
    }
    #letter-grid.delete-mode .letter-toggle:nth-child(2n){ animation-delay: 0.05s; }
    #letter-grid.delete-mode .letter-toggle:nth-child(3n){ animation-delay: 0.09s; }
    #letter-grid.delete-mode .letter-toggle:nth-child(5n){ animation-delay: 0.13s; }
  </style>
 </head>
 <body>
  <header>
   <h1 class="title">مولد الحروف</h1>
  </header>

  <main style="display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4.5vmin; width:100%; min-height:0; flex:1;">
   <div class="board">
    <div id="letter" class="letter-display">؟</div>
   </div>

   <div class="lever-wrap">
    <button id="gen-btn" type="button">حرف جديد</button>
   </div>

   <div class="grid-wrap">
    <div id="letter-grid"></div>
    <p class="hint" id="delete-hint">اضغط على الحرف لإزالته...</p>
   </div>

   <div class="tool-row">
    <button id="delete-btn" type="button" class="tool-btn">حذف حرف</button>
    <button id="reset-btn" type="button" class="tool-btn">فتح جميع الحروف</button>
   </div>

   <div class="log-wrap">
    <div class="log-header">
     <span class="log-title">السجل</span>
     <button id="copy-btn" type="button">نسخ</button>
    </div>
    <textarea id="log" rows="2" readonly placeholder="ستُسجَّل هنا الحروف التي تظهر..."></textarea>
   </div>
  </main>

  <div class="modal-overlay hidden" id="confirm-modal">
   <div class="modal-box">
    <p class="modal-text">هل أنت متأكد من رغبتك في فتح جميع الحروف ومسح السجل؟</p>
    <div class="modal-actions">
     <button type="button" class="modal-btn modal-confirm" id="confirm-yes">تأكيد</button>
     <button type="button" class="modal-btn modal-cancel" id="confirm-no">إلغاء</button>
    </div>
   </div>
  </div>

  <script>
    const allLetters = 'أبتثجحخدذرزسشصضطظعغفقكلمنهوي'.split('');
    const excluded = new Set();
    const display = document.getElementById('letter');
    const grid = document.getElementById('letter-grid');
    const genBtn = document.getElementById('gen-btn');
    const resetBtn = document.getElementById('reset-btn');
    const deleteBtn = document.getElementById('delete-btn');
    const logBox = document.getElementById('log');
    const deleteHint = document.getElementById('delete-hint');
    const copyBtn = document.getElementById('copy-btn');
    const confirmModal = document.getElementById('confirm-modal');
    const confirmYes = document.getElementById('confirm-yes');
    const confirmNo = document.getElementById('confirm-no');

    const letterBtns = new Map();
    const history = [];
    let deleteMode = false;

    function renderLog() {
      logBox.value = history
        .map((l, i) => `${i + 1}. ${l}`)
        .join('   ');
      logBox.scrollTop = logBox.scrollHeight;
    }

    function addToHistory(letter) {
      const idx = history.indexOf(letter);
      if (idx !== -1) history.splice(idx, 1);
      history.push(letter);
      renderLog();
    }

    function removeFromHistory(letter) {
      const idx = history.indexOf(letter);
      if (idx !== -1) {
        history.splice(idx, 1);
        renderLog();
      }
    }

    allLetters.forEach(l => {
      const btn = document.createElement('button');
      btn.className = 'letter-toggle';
      btn.textContent = l;
      btn.type = 'button';
      btn.setAttribute('aria-pressed', 'true');
      letterBtns.set(l, btn);
      btn.addEventListener('click', () => {
        if (!deleteMode) return;
        if (excluded.has(l)) {
          excluded.delete(l);
          btn.classList.remove('disabled');
          btn.setAttribute('aria-pressed', 'true');
          removeFromHistory(l);
        } else {
          excluded.add(l);
          btn.classList.add('disabled');
          btn.setAttribute('aria-pressed', 'false');
          addToHistory(l);
        }
      });
      grid.appendChild(btn);
    });

    deleteBtn.addEventListener('click', () => {
      deleteMode = !deleteMode;
      deleteBtn.classList.toggle('active', deleteMode);
      deleteBtn.textContent = deleteMode ? 'إنهاء الحذف' : 'حذف حرف';
      grid.classList.toggle('delete-mode', deleteMode);
      deleteHint.classList.toggle('visible', deleteMode);
    });

    resetBtn.addEventListener('click', () => {
      confirmModal.classList.remove('hidden');
    });

    confirmYes.addEventListener('click', () => {
      excluded.clear();
      letterBtns.forEach(btn => {
        btn.classList.remove('disabled');
        btn.setAttribute('aria-pressed', 'true');
      });
      history.length = 0;
      renderLog();
      deleteMode = false;
      deleteBtn.classList.remove('active');
      deleteBtn.textContent = 'حذف حرف';
      grid.classList.remove('delete-mode');
      deleteHint.classList.remove('visible');
      confirmModal.classList.add('hidden');
    });

    confirmNo.addEventListener('click', () => {
      confirmModal.classList.add('hidden');
    });

    copyBtn.addEventListener('click', async () => {
      const text = logBox.value;
      try {
        await navigator.clipboard.writeText(text);
      } catch (e) {
        logBox.removeAttribute('readonly');
        logBox.select();
        document.execCommand('copy');
        logBox.setAttribute('readonly', 'true');
      }
      const original = copyBtn.textContent;
      copyBtn.textContent = 'تم النسخ';
      setTimeout(() => { copyBtn.textContent = original; }, 1200);
    });

    let spinning = false;

    genBtn.addEventListener('click', () => {
      if (spinning) return;
      const pool = allLetters.filter(l => !excluded.has(l));
      if (pool.length === 0) return;

      spinning = true;
      genBtn.disabled = true;

      let steps = 18 + Math.floor(Math.random() * 8);
      let delay = 40;
      let i = 0;
      let lastLetter = null;

      function tick() {
        const randomLetter = pool[Math.floor(Math.random() * pool.length)];

        if (lastLetter && letterBtns.has(lastLetter)) {
          letterBtns.get(lastLetter).classList.remove('shuffle');
        }

        if (letterBtns.has(randomLetter)) {
          letterBtns.get(randomLetter).classList.add('shuffle');
        }
        lastLetter = randomLetter;

        display.classList.remove('pop');
        display.classList.add('flip');
        setTimeout(() => {
          display.textContent = randomLetter;
          display.classList.remove('flip');
        }, 55);

        i++;
        if (i < steps) {
          delay += (i > steps * 0.6) ? 30 : 5;
          setTimeout(tick, delay);
        } else {
          if (lastLetter && letterBtns.has(lastLetter)) {
            letterBtns.get(lastLetter).classList.remove('shuffle');
            excluded.add(lastLetter);
            letterBtns.get(lastLetter).classList.add('disabled');
            letterBtns.get(lastLetter).setAttribute('aria-pressed', 'false');
            addToHistory(lastLetter);
          }
          setTimeout(() => {
            display.classList.add('pop');
            setTimeout(() => display.classList.remove('pop'), 320);
            spinning = false;
            genBtn.disabled = false;
          }, 60);
        }
      }
      tick();
    });
  </script>
</body>
</html>
