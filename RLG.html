<!doctype html>
<html lang="ar" dir="rtl"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مولد الحروف</title>
  <link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg-deep: #12141c;
      --bg-deep-2: #1b1e29;
      --panel: #23283a;
      --hinge: rgba(0,0,0,0.55);
      --cream: #f2ecd9;
      --cream-dim: #9aa0b4;
      --amber: #f2b84b;
      --amber-dim: rgba(242,184,75,0.35);
      --off-red-dim: rgba(122,51,70,0.4);
    }
    *{ box-sizing: border-box; }
    html,body{ height:100%; margin:0; }
    body{
      font-family: 'Cairo', sans-serif;
      min-height:100vh;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap: 34px;
      padding: 32px 20px;
      background:
        radial-gradient(circle at 50% 0%, rgba(242,184,75,0.06), transparent 55%),
        linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-deep-2) 100%);
      color: var(--cream);
      overflow-x:hidden;
    }

    /* ---------- Title ---------- */
    header{ text-align:center; }
    .title{
      font-family: 'Lalezar', 'Cairo', sans-serif;
      font-weight:400;
      font-size: clamp(2rem, 6vw, 3.1rem);
      letter-spacing: 2px;
      color: var(--amber);
      text-shadow: 0 0 30px rgba(242,184,75,0.35);
      margin:0;
    }
    .eyebrow{
      font-size: 12px;
      letter-spacing: 4px;
      color: var(--cream-dim);
      margin: 0 0 6px;
      text-transform: uppercase;
    }

    /* ---------- Main split-flap card ---------- */
    .board{
      position: relative;
      width: min(78vw, 300px);
      aspect-ratio: 1 / 1.05;
      background: var(--panel);
      border-radius: 18px;
      box-shadow:
        0 20px 50px rgba(0,0,0,0.55),
        inset 0 0 0 1px rgba(255,255,255,0.04);
      display:flex; align-items:center; justify-content:center;
      perspective: 900px;
    }
    .board::before, .board::after{
      content:"";
      position:absolute; inset: 10px;
      border-radius: 10px;
      pointer-events:none;
    }
    .board::before{
      background: linear-gradient(180deg, rgba(255,255,255,0.05), transparent 40%);
    }
    .board::after{
      top: 50%; bottom: auto; left: 10px; right: 10px; height: 3px;
      transform: translateY(-50%);
      background: var(--hinge);
      box-shadow: 0 1px 0 rgba(255,255,255,0.06);
    }
    .letter-display{
      position: relative;
      font-family: 'Lalezar', 'Cairo', sans-serif;
      font-weight:400;
      font-size: clamp(6rem, 24vw, 9.5rem);
      line-height: 1;
      color: var(--cream);
      transform-style: preserve-3d;
      transition: transform 0.11s ease-out;
      user-select:none;
    }
    .letter-display.flip{
      transform: rotateX(35deg) scale(0.94);
    }
    .letter-display.pop{
      animation: settle 0.32s ease-out;
    }
    @keyframes settle{
      0%{ transform: rotateX(-18deg) scale(1.08); }
      60%{ transform: rotateX(6deg) scale(0.98); }
      100%{ transform: rotateX(0) scale(1); }
    }

    /* ---------- Lever button ---------- */
    .lever-wrap{ display:flex; flex-direction:column; align-items:center; gap:10px; }
    #gen-btn{
      font-family:'Cairo', sans-serif;
      font-weight:800;
      font-size: 19px;
      color: var(--bg-deep);
      background: linear-gradient(180deg, #ffd27a, var(--amber));
      border: none;
      padding: 16px 52px;
      border-radius: 999px;
      cursor:pointer;
      box-shadow:
        0 8px 0 #b8842b,
        0 16px 26px rgba(242,184,75,0.25);
      transition: transform 0.08s ease, box-shadow 0.08s ease;
      letter-spacing: 0.5px;
    }
    #gen-btn:active{
      transform: translateY(6px);
      box-shadow:
        0 2px 0 #b8842b,
        0 6px 14px rgba(242,184,75,0.2);
    }
    #gen-btn:disabled{
      opacity:0.6;
      cursor:default;
    }

    /* ---------- Letter tile grid ---------- */
    .grid-wrap{ width: min(92vw, 460px); display:flex; flex-direction:column; align-items:center; gap:10px; }
    #letter-grid{
      display:flex; flex-wrap:wrap; justify-content:center; gap:7px;
    }
    .letter-toggle{
      position:relative;
      width: 38px; height: 38px;
      border-radius: 6px;
      font-family:'Cairo', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer;
      border: none;
      background: var(--panel);
      color: var(--cream);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06), 0 2px 0 rgba(0,0,0,0.35);
      transition: transform 0.12s ease, background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
    }
    .letter-toggle::after{
      content:"";
      position:absolute; left:4px; right:4px; top:50%;
      height:1px; background: rgba(0,0,0,0.4);
      transform: translateY(-50%);
    }
    .letter-toggle:hover{ transform: translateY(-2px); }
    .letter-toggle.disabled{
      background: var(--off-red-dim);
      color: #cfa7b1;
      text-decoration: line-through;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03);
      opacity:0.55;
    }
    .letter-toggle.shuffle{
      background: var(--amber);
      color: var(--bg-deep);
      box-shadow: 0 0 0 2px var(--amber-dim), 0 4px 12px rgba(242,184,75,0.4);
      transform: scale(1.12);
    }
    .hint{
      font-size: 12px;
      color: var(--cream-dim);
      opacity: 0.6;
      letter-spacing: 0.3px;
      margin: 0;
      text-align:center;
    }
  </style>
 </head>
 <body>
  <header>
   <p class="eyebrow">اسم • حيوان • نبات • جماد</p>
   <h1 class="title">مولد الحروف</h1>
  </header>

  <main style="display:flex; flex-direction:column; align-items:center; gap:30px;">
   <div class="board">
    <div id="letter" class="letter-display">؟</div>
   </div>

   <div class="lever-wrap">
    <button id="gen-btn" type="button">حرف جديد</button>
   </div>

   <div class="grid-wrap">
    <div id="letter-grid"></div>
    <p class="hint">اضغط على الحرف لإيقافه</p>
   </div>
  </main>

  <script>
    const allLetters = 'أبتثجحخدذرزسشصضطظعغفقكلمنهوي'.split('');
    const excluded = new Set();
    const display = document.getElementById('letter');
    const grid = document.getElementById('letter-grid');
    const genBtn = document.getElementById('gen-btn');

    const letterBtns = new Map();

    allLetters.forEach(l => {
      const btn = document.createElement('button');
      btn.className = 'letter-toggle';
      btn.textContent = l;
      btn.type = 'button';
      btn.setAttribute('aria-pressed', 'true');
      letterBtns.set(l, btn);
      btn.addEventListener('click', () => {
        if (excluded.has(l)) {
          excluded.delete(l);
          btn.classList.remove('disabled');
          btn.setAttribute('aria-pressed', 'true');
        } else {
          excluded.add(l);
          btn.classList.add('disabled');
          btn.setAttribute('aria-pressed', 'false');
        }
      });
      grid.appendChild(btn);
    });

    let spinning = false;

    genBtn.addEventListener('click', () => {
      if (spinning) return;
      const pool = allLetters.filter(l => !excluded.has(l));
      if (pool.length === 0) return;

      spinning = true;
      genBtn.disabled = true;

      let steps = 18 + Math.floor(Math.random() * 8);
      let delay = 40;
      let i = 0;
      let lastLetter = null;

      function tick() {
        const randomLetter = pool[Math.floor(Math.random() * pool.length)];

        if (lastLetter && letterBtns.has(lastLetter)) {
          letterBtns.get(lastLetter).classList.remove('shuffle');
        }

        if (letterBtns.has(randomLetter)) {
          letterBtns.get(randomLetter).classList.add('shuffle');
        }
        lastLetter = randomLetter;

        display.classList.remove('pop');
        display.classList.add('flip');
        setTimeout(() => {
          display.textContent = randomLetter;
          display.classList.remove('flip');
        }, 55);

        i++;
        if (i < steps) {
          delay += (i > steps * 0.6) ? 30 : 5;
          setTimeout(tick, delay);
        } else {
          if (lastLetter && letterBtns.has(lastLetter)) {
            letterBtns.get(lastLetter).classList.remove('shuffle');
            excluded.add(lastLetter);
            letterBtns.get(lastLetter).classList.add('disabled');
            letterBtns.get(lastLetter).setAttribute('aria-pressed', 'false');
          }
          setTimeout(() => {
            display.classList.add('pop');
            setTimeout(() => display.classList.remove('pop'), 320);
            spinning = false;
            genBtn.disabled = false;
          }, 60);
        }
      }
      tick();
    });
  </script>
</body>
</html>
